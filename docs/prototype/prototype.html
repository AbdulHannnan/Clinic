<meta charset="utf-8">
<title>ClinicQ Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: three live screens side by side (patient phone, management desk, doctor's room) sharing one queue */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#e5eeea; --ink:#12201d; --muted:#586a65; --line:#d0dcd8;
  --accent:#0e6e5d; --accent-ink:#ffffff; --accent-soft:#d2eae4;
  --online:#2354c2; --online-soft:#e0e8fb; --walkin:#a35a08; --walkin-soft:#f8e8d2;
  --emerg:#c02b2b; --emerg-soft:#fadcdc; --ok:#1b7c45; --ok-soft:#dbf0e2; --warn:#8f6200; --warn-soft:#fbefcb;
  --wa:#178a48; --wa-soft:#d9f3e2; --plan:#6a3fb8; --plan-soft:#ece3fb; --plan-ink:#ffffff; --frame:#1a2725; --scrim:rgba(8,16,14,.55);
  --shadow:0 1px 2px rgba(18,32,29,.06),0 8px 24px rgba(18,32,29,.07);
  --paper:#fffdf7; --paper-ink:#1c1c1a; --paper-muted:#68645b; --paper-line:#dcd6c8; --paper-accent:#0e6e5d;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --urdu:"Noto Nastaliq Urdu","Noto Naskh Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1413; --surface:#13201e; --surface-2:#1a2a27; --ink:#e2ece8; --muted:#95a8a3; --line:#28403b;
  --accent:#45c3a7; --accent-ink:#05211b; --accent-soft:#163f37;
  --online:#8aabff; --online-soft:#1b2a4d; --walkin:#f2a653; --walkin-soft:#3b2a12;
  --emerg:#ff8484; --emerg-soft:#441c1c; --ok:#62d190; --ok-soft:#163a25; --warn:#f0c55a; --warn-soft:#3a3013;
  --wa:#4cd387; --wa-soft:#143a24; --plan:#c3a6ff; --plan-soft:#2c2142; --plan-ink:#1d1133; --frame:#020706; --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1413; --surface:#13201e; --surface-2:#1a2a27; --ink:#e2ece8; --muted:#95a8a3; --line:#28403b;
  --accent:#45c3a7; --accent-ink:#05211b; --accent-soft:#163f37;
  --online:#8aabff; --online-soft:#1b2a4d; --walkin:#f2a653; --walkin-soft:#3b2a12;
  --emerg:#ff8484; --emerg-soft:#441c1c; --ok:#62d190; --ok-soft:#163a25; --warn:#f0c55a; --warn-soft:#3a3013;
  --wa:#4cd387; --wa-soft:#143a24; --plan:#c3a6ff; --plan-soft:#2c2142; --plan-ink:#1d1133; --frame:#020706; --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
span.mono,b.mono{direction:ltr;unicode-bidi:isolate}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
:root[lang="ur"] body{font-family:var(--urdu),var(--body);line-height:2;font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
:root[lang="ur"] .lbl{text-transform:none;letter-spacing:0;font-size:12px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.02em}
.logo{width:32px;height:32px}
.tag{font-size:11px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.app-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1239px){.wideonly{display:none!important}}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;line-height:1.2;text-align:start}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--emerg)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.big{padding:11px 16px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tip{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.tip b{font-family:var(--display)}
.tip ol{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;counter-reset:s}
.tip li{counter-increment:s;display:flex;gap:7px;align-items:center;font-size:13px}
.tip li::before{content:counter(s);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 11px var(--mono);flex:none}

.stage{display:grid;gap:14px;align-items:start}
.stage[data-view="all"]{grid-template-columns:372px minmax(0,1fr) minmax(0,1.1fr)}
.stage[data-view="single"] .panel{width:100%;max-width:900px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--display);font-size:16px;margin:0;display:flex;gap:8px;align-items:center;font-weight:700}
:root[lang="ur"] .panel-h h2{font-family:var(--urdu)}
.live{font-size:12px;color:var(--ok);display:inline-flex;gap:6px;align-items:center;font-weight:600}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.panel-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.p-patient{background:transparent;border:0}
.p-patient .panel-h{border:0;padding:4px 6px 10px}

/* Phone */
.phone{width:100%;max-width:372px;margin:0 auto;height:780px;border:9px solid var(--frame);border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow)}
@media (max-width:440px){.phone{border-width:0;border-radius:16px;height:auto;min-height:620px;border:1px solid var(--line)}}
.app-head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}
.app-head b{font-family:var(--display);font-size:17px}
:root[lang="ur"] .app-head b{font-family:var(--urdu)}
.app-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.app-nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.app-nav button{border:0;background:none;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer}
.app-nav button[aria-current="page"]{color:var(--accent)}
.app-nav svg.i{width:21px;height:21px}
.ptoast{position:absolute;top:10px;left:10px;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:5;display:flex;gap:10px;align-items:flex-start;font-size:13px;animation:drop .35s ease}
.ptoast .pic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--wa-soft);color:var(--wa)}
.ptoast .pt-t{font-size:11.5px;color:var(--muted);font-weight:700}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:11px}
.tc-h,.dc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc-doc{font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--surface-2);border-radius:12px;padding:9px 12px;min-width:0}
.tile .big{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.15;display:inline-block}
.tile .mid{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.35}
.tile.me{background:var(--accent);color:var(--accent-ink)}
.tile.me .lbl{color:inherit;opacity:.85}
.ahead{display:flex;align-items:baseline;gap:9px;font-weight:600}
.ahead .n{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;color:var(--accent)}
.track{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dot{min-width:32px;height:28px;padding:0 6px;border-radius:7px;display:inline-grid;place-items:center;font:600 12px var(--mono);background:var(--surface-2);color:var(--muted)}
.dot.cur{background:var(--ok-soft);color:var(--ok)}
.dot.me{background:var(--accent);color:var(--accent-ink)}
.dot.gap{background:transparent;min-width:auto}
.when{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:9px 12px}
.when svg.i{width:22px;height:22px;color:var(--accent)}
.when b{font-size:16px}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.yourturn{display:flex;gap:12px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:14px;font-size:16px}
.yourturn svg.i{width:30px;height:30px}
.note{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.danger{background:var(--emerg-soft);color:var(--emerg)}
.note.muted{background:var(--surface-2);color:var(--muted)}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty svg.i{width:34px;height:34px;color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill svg.i{width:13px;height:13px}
.pill.available{background:var(--ok-soft);color:var(--ok)}
.pill.break{background:var(--warn-soft);color:var(--warn)}
.pill.closed{background:var(--surface-2);color:var(--muted)}
.b{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.b svg.i{width:12px;height:12px}
.b.online{background:var(--online-soft);color:var(--online)}
.b.walkin{background:var(--walkin-soft);color:var(--walkin)}
.b.emergency{background:var(--emerg-soft);color:var(--emerg)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.due{background:var(--warn-soft);color:var(--warn)}
.b.muted{background:var(--surface-2);color:var(--muted)}

.dc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px}
.av{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 15px var(--display)}
.dc-b{display:flex;flex-direction:column;gap:7px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.facts span{display:inline-flex;gap:4px;align-items:center}
.facts b{color:var(--ink)}
.dc-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fee{font:600 14px var(--mono)}
.form label.f,label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink);font-size:14px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.in{resize:vertical;min-height:58px}
.payopt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;cursor:pointer;text-align:start;color:var(--ink)}
.opt svg.i{width:20px;height:20px;color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.msg{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px dashed var(--line);font-size:13px}
.chs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ch{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.ch.wa{background:var(--wa-soft);color:var(--wa)}
.ch.sms{background:var(--online-soft);color:var(--online)}
.ch.app{background:var(--accent-soft);color:var(--accent)}

/* Staff */
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sh h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
:root[lang="ur"] .sh h3{text-transform:none;letter-spacing:0;font-size:13px}
.dpills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
.box{background:var(--surface-2);border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.box .big{font:600 30px/1.1 var(--mono);display:inline-block}
.box .seg{background:var(--surface)}
.box .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat b{font-size:22px}
.step{display:inline-flex;align-items:center;gap:5px}
.step input{width:54px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);color:var(--ink)}
.walk{display:flex;flex-direction:column;gap:9px;border:1px dashed var(--line);border-radius:14px;padding:12px}
.walk-acts{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.err{color:var(--emerg);font-size:12.5px;min-height:0}
.err:empty{display:none}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:10px;border:1px solid var(--line);border-radius:12px;align-items:start;background:var(--surface)}
.row .name{font-weight:700}
.row .meta,.pt .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;align-items:center;font-size:12px;color:var(--muted)}
.row .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.row.inroom{background:var(--ok-soft);border-color:transparent}
.row.attn{border-color:var(--warn);background:var(--warn-soft)}
.attn-t{display:flex;gap:6px;align-items:center;color:var(--warn);font-weight:700;font-size:12.5px;margin-top:5px}
.tok{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font:600 16px var(--mono);flex:none}
.tok.online{background:var(--online-soft);color:var(--online)}
.tok.walkin{background:var(--walkin-soft);color:var(--walkin)}
.tok.emergency{background:var(--emerg-soft);color:var(--emerg)}
.list.compact .row{padding:7px 9px;align-items:center}
.list.compact .tok{width:36px;height:36px;font-size:13px;border-radius:9px}
details.done summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;padding:4px 0}
details.done .list{margin-top:8px}
.donerow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);padding:4px 2px}
.donerow .mono{min-width:34px}

.dhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end}
.dname{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
:root[lang="ur"] .dname{font-family:var(--urdu);font-size:19px}
.dstats{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.dstats b{font-size:20px;color:var(--ink)}
.cur{gap:13px}
.cur.em{border-color:var(--emerg);box-shadow:inset 0 0 0 1px var(--emerg)}
.pt{display:flex;gap:12px;align-items:center}
.pt .tok{width:60px;height:60px;font-size:21px;border-radius:14px}
.pt h3{margin:0;font-family:var(--display);font-size:22px;line-height:1.15}
.sym{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hist{background:var(--surface-2);border-radius:12px;padding:11px 12px;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;gap:8px}
.hist p{margin:2px 0 0}
.lock{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center;font-weight:600}
.pv{font-size:13px;padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add::before{content:"+ ";color:var(--accent);font-weight:800}
.meds{display:flex;flex-direction:column;gap:6px}
.med{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) 54px minmax(0,1.4fr) auto;gap:6px;align-items:center}
.med .in{padding:6px 8px;font-size:13px}
.med.head{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
@container (max-width:560px){.med{grid-template-columns:1fr 1fr 54px auto}.med .nm{grid-column:1/-1}.med .wh{grid-column:1/3}.med.head{display:none}}
.doneBar{display:flex;flex-wrap:wrap;gap:8px}
.doneBar .primary{flex:1 1 220px;justify-content:center}
.idle{align-items:flex-start}

/* Prescription */
.mback{position:fixed;inset:0;background:var(--scrim);z-index:50;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;align-items:flex-start}
.mwrap{width:min(680px,100%);display:flex;flex-direction:column;gap:10px}
.m-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.rx{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:30px 34px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:var(--body);font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:16px;min-height:720px}
@media (max-width:560px){.rx{padding:20px 18px;min-height:0}}
.rx-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--paper-accent);padding-bottom:12px}
.rx-clinic{font:800 22px var(--display);color:var(--paper-accent);letter-spacing:-.01em}
.rx-sub,.rx-doc div{color:var(--paper-muted);font-size:12.5px}
.rx-doc{text-align:right}
.rx-doc b{font-size:15px}
.rx-pt{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px;border-bottom:1px solid var(--paper-line);padding-bottom:12px}
.rx-pt span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted);font-weight:700}
.rx-al{color:#b42323;font-weight:700;font-size:13px}
.rx-body{flex:1;display:flex;flex-direction:column;gap:12px}
.rx-sym{font:700 34px/1 Georgia,"Times New Roman",serif;color:var(--paper-accent)}
.rx-tw{overflow-x:auto}
.rx-t{width:100%;border-collapse:collapse;font-size:13px;min-width:440px}
.rx-t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding:6px 6px}
.rx-t td{padding:8px 6px;border-bottom:1px dashed var(--paper-line);vertical-align:top}
.rx-t .mono{white-space:nowrap}
.rx-dose{font-size:11.5px;color:var(--paper-muted)}
.rx-adv h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-muted)}
.rx-adv ul{margin:0;padding-left:18px}
.rx-f{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-top:1px solid var(--paper-line);padding-top:12px;font-size:11.5px;color:var(--paper-muted)}
.sig span{display:block;width:170px;border-bottom:1px solid var(--paper-ink);height:30px;margin-bottom:4px}

/* Finance */
.bname{display:flex;flex-direction:column;line-height:1.15}
.bname .sub{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .lbl{display:flex;gap:5px;align-items:center}
.kpi .v{font:600 21px/1.2 var(--mono)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--accent);color:var(--accent-ink)}
.kpi.hl .lbl,.kpi.hl .s{color:inherit;opacity:.85}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
:root[lang="ur"] .tbl th{text-transform:none;letter-spacing:0;font-size:12px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.tbl .num{text-align:end;font-family:var(--mono);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
:root[dir="rtl"] .tbl .num{text-align:left}
.tbl .num .sub{font-family:var(--body);white-space:normal}
.tbl .tok{width:34px;height:26px;font-size:12px;border-radius:7px}
.tbl tr.now td{background:var(--accent-soft)}
.tbl .cellb{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tbl.week{min-width:440px}
.tbl.week td:first-child,.tbl td:nth-child(2){white-space:nowrap}
.bar{height:10px;background:var(--accent);border-start-end-radius:4px;border-end-end-radius:4px;min-width:2px}
.disc{display:flex;flex-direction:column;gap:9px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.disc .chip{background:var(--surface)}
.disc .chip[aria-pressed="true"]{background:var(--accent)}
.feeLine{display:flex;gap:8px;align-items:baseline;font-size:15px}
.strike{text-decoration:line-through;color:var(--muted);font-size:13px}
/* Long-term plans */
.b.plan{background:var(--plan-soft);color:var(--plan)}
.tok.plan{background:var(--plan-soft);color:var(--plan);font-size:12.5px}
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:7px}
.prog span{display:block;height:100%;background:var(--plan);border-radius:999px}
.ltp{display:flex;flex-direction:column;gap:9px;background:var(--plan-soft);border-radius:12px;padding:10px 12px}
.ltp .prog{background:var(--surface);margin-top:0}
.ltp .chip{background:var(--surface)}
.ltp .chip[aria-pressed="true"]{background:var(--plan);border-color:var(--plan);color:var(--plan-ink)}
.optrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.optrow .lbl{min-width:120px}
.row.missed{border-color:var(--emerg)}
.in.sm{padding:3px 6px;font-size:12.5px;width:auto;border-radius:7px}
.gtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-weight:600;font-size:13.5px}
.foot{font-size:12.5px;color:var(--muted);max-width:90ch;margin:0}
.flash{animation:flash 1.3s ease}
@keyframes flash{0%{transform:scale(1.18);color:var(--accent)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

function addMonths(ms,n){const d=new Date(ms);d.setMonth(d.getMonth()+n);return +d;}

  if(b<0) return `<span class="b emergency">${t('refundDue')} <span class="mono">${rs(-b)}</span></span>`;
  if((p.status==='noshow'||p.status==='cancelled')&&!(p.paidAmt-p.refunded)) return '';
  if(net(p)===0&&p.disc>0) return `<span class="b muted">${t('free')}</span>`;
  return `<span class="b ok">${t('paid')}</span>`;
}
function moneyBtns(p){
  const b=bal(p);
  if(b>0) return `<button class="btn sm" data-act="collect" data-id="${p.id}" data-v="cash">${ic('cash')}${t('collect')} <span class="mono">${rs(b)}</span></button><button class="btn sm" data-act="collect" data-id="${p.id}" data-v="card">${ic('card')}${t('card')}</button>`;
  if(b<0) return `<button class="btn sm" data-act="refund" data-id="${p.id}">${ic('cash')}${t('refund')} <span class="mono">${rs(-b)}</span></button>`;
  return '';
}
function fin(id){
  const all=S.queue[id], billed=all.filter(p=>p.status!=='cancelled'&&p.status!=='noshow');
  const sum=(arr,f)=>arr.reduce((a,p)=>a+f(p),0), m={cash:0,card:0,online:0};
  all.forEach(p=>{if(p.method) m[p.method]+=p.paidAmt-p.refunded;});
  return {patients:billed.length,seen:all.filter(p=>p.status==='done').length,
    online:billed.filter(p=>p.type==='online').length,walkin:billed.filter(p=>p.type==='walkin').length,emerg:billed.filter(p=>p.type==='emergency').length,
    gross:sum(billed,p=>p.fee),disc:sum(billed,p=>p.disc),discN:billed.filter(p=>p.disc>0).length,
    collected:sum(all,p=>p.paidAmt-p.refunded),due:sum(all,p=>Math.max(0,bal(p))),refund:sum(all,p=>Math.max(0,-bal(p))),m};
}
function publicStatus(doc){
  if(doc.status==='closed') return 'closed';
  const c=current(doc.id);
  return (doc.status==='break'||(c&&c.type==='emergency'))?'break':'available';
}
function nowServing(id){
  const c=current(id); if(c&&c.type!=='emergency') return c.token;
  const d=S.queue[id].filter(p=>p.status==='done'&&p.type!=='emergency').sort((a,b)=>b.order-a.order)[0];
  return d?d.token:null;
}
function extra(doc){const c=current(doc.id);return (c?Math.round(doc.mins/2):0)+(doc.status==='break'?10:0);}
const estMinutes=p=>{const doc=D(p.doc);return aheadAll(p)*doc.mins+extra(doc);};
const newEst=doc=>waitingList(doc.id).length*doc.mins+extra(doc);
function emergencyOrder(id){
  const wl=waitingList(id), c=current(id);
  const firstN=wl.find(p=>p.type!=='emergency');
  const lastE=wl.filter(p=>p.type==='emergency'&&(!firstN||p.order<firstN.order)).pop();
  const lo=lastE?lastE.order:(c?c.order:(firstN?firstN.order-1:0));
  const hi=firstN?firstN.order:lo+2;
  return (lo+hi)/2;
}
function sendMsg(p,kind,params={}){
  const m={kind,at:Date.now(),doc:p.doc,pname:p.name,phone:p.phone,ch:params.ch||['wa','sms','app'],params:Object.assign({docId:p.doc,token:p.token},params)};
  S.feed.unshift(m);

}
function remindParams(p){return {ahead:aheadOf(p),time:fmt(Date.now()+(estMinutes(p)-5)*MIN)};}
function checkReminders(id){
  waitingList(id).forEach(p=>{
    if(p.type==='emergency'||p.reminded) return;

}
function draft(pid){return S.drafts[pid]||(S.drafts[pid]={notes:[],custom:'',meds:[],fu:''});}
function visitFromDraft(pid){

}
function callNext(id){

function msgText(m){

    case 'booked': return ur?`${d} کے ساتھ بکنگ کنفرم۔ آپ کا نمبر ${P.token} ہے۔ براہِ کرم ${P.time} کے درمیان پہنچیں۔`

    case 'rx': return ur?`${d} کا نسخہ تیار ہے۔ دیکھنے کے لیے ایپ میں ریکارڈ کھولیں۔`:`Your prescription from ${d} is ready. Open Records in the app to view it.`;

                               :`Your ${c} treatment plan with ${d} has started: a check-up every ${ev} for ${du}. We will remind you on WhatsApp and SMS before each visit.`;
    case 'fuRemind': return ur?`یاد دہانی: ${d} کے پاس آپ کا ${c} کا معائنہ ${dt} کو ہے (معائنہ ${P.n} از ${P.N})۔ ایپ میں نمبر بک کریں یا کلینک تشریف لائیں۔`
                                :`Reminder: your ${c} check-up with ${d} is due on ${dt} (visit ${P.n} of ${P.N}). Please book your number in the app or come to the clinic.`;

    ${pat.allergy?`<div class="rx-al">Allergy: ${esc(pat.allergy)}</div>`:''}
    <div class="rx-body"><div class="rx-sym">℞</div>
      ${v.meds.length?`<div class="rx-tw"><table class="rx-t"><thead><tr><th>#</th><th>Medicine</th><th>Dose</th><th>Days</th><th>Instructions</th></tr></thead><tbody>${v.meds.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.name)}</b></td><td class="mono">${esc(m.dose)}</td><td class="mono">${esc(m.days)}</td><td>${esc(m.when)}</td></tr>`).join('')}</tbody></table></div><div class="rx-dose">Dose key: morning + afternoon + night</div>`:'<p class="rx-dose">No medicines prescribed.</p>'}
      ${v.notes.length?`<div class="rx-adv"><h4>Diagnosis &amp; advice</h4><ul>${v.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
      ${v.fu?`<div>Follow-up: <b>after ${esc(v.fu)}</b></div>`:''}
      ${(pl=>pl?`<div>Treatment plan: <b>${T.en['c_'+pl.cond]}, check-up every ${T.en['e_'+pl.every]} until ${fmtDate(planEnd(pl))}</b></div>`:'')(planOf(pat))}
    </div>
    <div class="rx-f"><div class="sig"><span></span>Doctor’s signature</div><div>Issued via ClinicQ · ${esc(doc.clinic)}<br>PMDC Reg. 00000-P (sample)</div></div>
  </div>`;
}
function renderModal(){
  const el=document.getElementById('modal'), m=S.modal;
  if(!m){el.innerHTML='';return;}
  let pat,doc,v;
  if(m.live){pat=current(S.staffDoc);if(!pat){S.modal=null;el.innerHTML='';return;}doc=D(pat.doc);v=visitFromDraft(pat.id);}
  else{v=S.myVisits[m.idx];doc=D(v.docId);pat=Object.assign({},S.me,{token:v.token,allergy:''});}
  el.innerHTML=`<div class="mback" data-act="closeModal" data-self="1"><div class="mwrap" role="dialog" aria-modal="true" aria-label="Prescription">${rxHtml(pat,doc,v)}
    <div class="m-acts"><button class="btn" data-act="printRx">${ic('printer')}${t('print')}</button>${m.live?`<button class="btn" data-act="waRx">${ic('msg')}${t('sendWA')}</button>`:''}<button class="btn primary" data-act="closeModal">${t('close')}</button></div></div></div>`;
}

/* ---------- shell ---------- */
function layout(){
  const wide=matchMedia('(min-width:1240px)').matches;
  let v=S.view; if(v==='all'&&!wide) v='patient';
  const all=S.view==='all'&&wide;
  document.getElementById('stage').dataset.view=all?'all':'single';
  document.getElementById('pPatient').hidden=!(all||v==='patient');
  document.getElementById('pReception').hidden=!(all||v==='reception');
  document.getElementById('pDoctor').hidden=!(all||v==='doctor');
}
function render(){
  const R=document.documentElement; R.lang=S.lang; R.dir=S.lang==='ur'?'rtl':'ltr';
  const a=document.activeElement, fid=a&&a.id, s0=a&&a.selectionStart, s1=a&&a.selectionEnd;
  const logo=`<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="5" fill="var(--accent)"/><circle cx="2" cy="16" r="3" fill="var(--bg)"/><circle cx="30" cy="16" r="3" fill="var(--bg)"/><path d="M11 16h10M16 11v10" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>`;
  document.getElementById('top').innerHTML=`<div class="brand">${logo}<div class="bname"><b>${esc(D('d1').clinic)}</b><span class="sub">${esc(dn(D('d1')))} · Powered by ClinicQ</span></div><span class="tag">${t('prototype')}</span></div>
    <div class="seg" role="group" aria-label="Screen">${['all','patient','reception','doctor'].map(v=>`<button data-act="view" data-v="${v}" aria-pressed="${S.view===v}" class="${v==='all'?'wideonly':''}">${v==='patient'?ic('mobile'):v==='reception'?ic('users'):v==='doctor'?ic('steth'):''}${t(v==='all'?'allViews':v)}</button>`).join('')}</div>
    <div class="tools"><button class="btn sm" data-act="lang">${ic('globe')}${S.lang==='en'?'اردو':'English'}</button><button class="btn sm ghost" data-act="reset">${ic('reset')}${t('resetDemo')}</button></div>`;
  document.getElementById('tip').innerHTML=`<b>${t('tryIt')}</b><ol>${t('steps').map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  document.getElementById('foot').textContent=t('foot');
  layout(); renderPatient(); renderReception(); renderDoctor(); renderModal();
  S.flash={};
  if(fid){const n=document.getElementById(fid);if(n&&n!==a){n.focus({preventScroll:true});try{if(s0!=null)n.setSelectionRange(s0,s1);}catch(_){}}}
}

/* ---------- actions ---------- */
const P=id=>Object.values(S.queue).flat().find(p=>p.id===id);
const ACT={
  view:(id,v)=>{S.view=v;},
  lang:()=>{S.lang=S.lang==='en'?'ur':'en';S0.lang=S.lang;},
  reset:()=>{S0.view=S.view;S=seed();toast(t('resetDemo'));},
  ptab:(id,v)=>{S.pTab=v;S.pBook=null;},
  openBook:id=>{S.pBook=id;S.forms.book={name:S.me.name,age:S.me.age,phone:S.me.phone,symptoms:'',history:S.me.history,pay:'online'};},
  closeBook:()=>{S.pBook=null;},
  pay:(id,v)=>{S.forms.book.pay=v;},
  imhere:id=>{P(id).arrived=true;},
  cancelBk:id=>{const p=P(id);p.status='cancelled';checkReminders(p.doc);S.flash[p.doc]=true;toast(t('cancelledToast'));},
  staffDoc:(id,v)=>{S.staffDoc=v;S.walkErr=false;},
  status:(id,v)=>{const d=D(S.staffDoc);d.status=v;S.flash[d.id]=true;toast(`${t('statusSet')} ${t(v==='available'?'available':v==='break'?'onBreak':'closed')}`);},
  mins:(id,v)=>{const d=D(S.staffDoc);d.mins=Math.min(90,Math.max(1,d.mins+ +v));},
  arrived:id=>{const p=P(id);p.arrived=true;toast(`${p.name} ${t('arrivedToast')}`);},
  call:id=>{const p=P(id);toast(`${t('calling')} ${p.name} · ${p.phone} (demo)`);},
  remind:id=>{const p=P(id);sendMsg(p,'remind',remindParams(p));toast(`${t('reminderSent')} ${p.name}`);},
  collect:(id,v)=>{const p=P(id),b=bal(p);if(b<=0)return;p.paidAmt+=b;p.method=v||'cash';p.paidAt=Date.now();toast(`${t('paidToast')} ${p.name} · ${rs(b)}`);},
  refund:id=>{const p=P(id),b=bal(p);if(b>=0)return;p.refunded-=b;toast(`${t('refundedToast')} ${p.name} · ${rs(-b)}`);},
  rtab:(id,v)=>{S.rTab=v;},
  runRem:()=>{const n=runReminders();toast(n?`${n} ${t('remSentN')}`:t('noRem'));},
  planRemind:id=>{const pl=S.plans.find(x=>x.id===id);sendMsg(planWho(pl),daysUntil(pl.next)<0?'fuMissed':'fuRemind',planParams(pl));toast(`${t('reminderSent')} ${pl.name}`);},
  planCall:id=>{const pl=S.plans.find(x=>x.id===id);toast(`${t('calling')} ${pl.name} · ${pl.phone} (demo)`);},
  planStop:id=>{const pl=S.plans.find(x=>x.id===id);pl.status='stopped';toast(`${t('planStopped')} ${pl.name}`);},
  planQueue:id=>{const pl=S.plans.find(x=>x.id===id),d=S.staffDoc;
    const p=mk(d,S.next[d]++,pl.name,pl.age,pl.g,'walkin','waiting',{arrived:true,phone:pl.phone,planId:pl.id,paid:'due',fee:D(d).fee,isMe:pl.isMe});
    p.order=maxOrder(d)+1;S.queue[d].push(p);checkReminders(d);toast(`${pl.name} ${t('addedFromPlan')} #${p.token}`);},
  ltpOpen:()=>{const c=current(S.staffDoc);if(c){S.ltpOpen=c.id;S.forms.ltpD={cond:/diabet/i.test(c.history)?'diab':/blood pressure/i.test(c.history)?'bp':'tb',dur:6,every:14};}},
  ltpCancel:()=>{S.ltpOpen=null;},
  ltpSet:(id,v)=>{const [k,x]=v.split(':');S.forms.ltpD[k]=k==='cond'?x:+x;},
  ltpSaveD:()=>{const c=current(S.staffDoc);if(!c)return;createPlan(c,S.forms.ltpD);S.ltpOpen=null;toast(`${t('planSaved')} ${c.name}`);},
  planEveryD:(id,v)=>{const pl=planOf(current(S.staffDoc));if(pl)setEvery(pl,+v);},
  disc:(id,v)=>{const c=current(S.staffDoc);if(!c)return;
    c.disc=v==='free'?c.fee:v==='half'?Math.round(c.fee/2):v==='500'?Math.min(500,c.fee):0;
    c.discReason=c.disc?(c.discReason||(v==='free'?'followup':'needy')):'';c.discBy=c.disc?'doctor':'';},
  noshow:id=>{const p=P(id);p.status='noshow';checkReminders(p.doc);S.flash[p.doc]=true;toast(`${p.name}: ${t('noShowToast')}`);},
  callNext:()=>{callNext(S.staffDoc);},
  note:(id,v)=>{const c=current(S.staffDoc);if(!c)return;const d=draft(c.id);d.notes=d.notes.includes(v)?d.notes.filter(n=>n!==v):[...d.notes,v];},
  addMed:(id,v)=>{const c=current(S.staffDoc);if(!c)return;draft(c.id).meds.push(+v>=0?Object.assign({},MEDS[+v]):{name:'',dose:'1+0+1',days:'5',when:'After meal'});},
  rmMed:(id,v)=>{const c=current(S.staffDoc);if(c)draft(c.id).meds.splice(+v,1);},
  done:()=>{
    const id=S.staffDoc, c=current(id); if(!c) return;
    const v=visitFromDraft(c.id); c.status='done'; c.visit=v;
    const pl=planOf(c); if(pl&&pl.status==='active') advancePlan(pl);
    if(c.isMe){S.myVisits.unshift(Object.assign({docId:id,token:c.token},v));}
    if(v.meds.length||v.notes.length) sendMsg(c,'rx',{ch:['wa','app']});
    callNext(id);
  },
  skip:()=>{
    const id=S.staffDoc, c=current(id); if(!c) return;
    const wl=waitingList(id), a=wl[1], b=wl[2];
    c.status='waiting'; c.arrived=false;
    c.order=a?(b?(a.order+b.order)/2:a.order+1):(wl[0]?wl[0].order+1:c.order);
    toast(`#${c.token} ${c.name}: ${t('skipToast')}`); callNext(id);
  },
  rx:()=>{S.modal={live:true};},
  viewRx:(id,v)=>{S.modal={live:false,idx:+v};},
  closeModal:()=>{S.modal=null;},
  printRx:()=>{toast(t('printDemo'));},
  waRx:()=>{const c=current(S.staffDoc);if(c){sendMsg(c,'rx',{ch:['wa']});toast(`${t('rxSent')} ${c.name} · ${c.phone}`);}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.self&&e.target!==el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset.id,el.dataset.v); render();
});
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind){
    setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
    if(el.dataset.bind==='me.history') Object.values(S.queue).flat().filter(p=>p.isMe).forEach(p=>p.history=el.value);
    if(el.dataset.bind==='forms.walk.name'&&S.walkErr&&el.value.trim()){S.walkErr=false;const er=document.querySelector('.walk .err');if(er)er.textContent='';}
  } else if(el.dataset.rx){const c=current(S.staffDoc);if(c)draft(c.id)[el.dataset.rx]=el.value;}
  else if(el.dataset.med!=null){const c=current(S.staffDoc);if(c){draft(c.id).meds[+el.dataset.med][el.dataset.f]=el.value;if(el.dataset.f==='name'&&/amox|penic/i.test(el.value)!==/amox|penic/i.test(el.defaultValue))render();}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.planEvery){const pl=S.plans.find(x=>x.id===el.dataset.planEvery);if(pl){setEvery(pl,+el.value);render();}}
  if(el.dataset.discr){const c=current(S.staffDoc);if(c)c.discReason=el.value;}
  if(el.dataset.mins){D(S.staffDoc).mins=Math.min(90,Math.max(1,parseInt(el.value,10)||1));render();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.target;
  if(form.dataset.form==='walk'){
    const type=(e.submitter&&e.submitter.dataset.v)||'walkin', f=S.forms.walk, id=S.staffDoc;
    if(!f.name.trim()){S.walkErr=true;render();document.getElementById('wk-name').focus();return;}
    S.walkErr=false;
    const base={arrived:true,fee:D(id).fee,paid:f.pay==='due'?'due':'paid',method:f.pay==='due'?'':f.pay,phone:f.phone.trim()};
    let p;
    if(type==='emergency'){p=mk(id,'E'+S.nextE[id]++,f.name.trim(),f.age,f.g,'emergency','waiting',base);p.order=emergencyOrder(id);}
    else{p=mk(id,S.next[id]++,f.name.trim(),f.age,f.g,'walkin','waiting',base);p.order=maxOrder(id)+1;}
    S.queue[id].push(p); S.forms.walk={name:'',phone:'',age:'',g:'M',pay:'cash'};
    checkReminders(id);
    toast(type==='emergency'?t('emergAdded'):`${p.name} ${t('walkAdded')} #${p.token}`);
    render();
  }
  if(form.dataset.form==='ltpR'){
    const f=S.forms.ltpR, p=f.pid&&P(f.pid);
    if(!p){S.ltErr=true;render();return;}
    S.ltErr=false; createPlan(p,f); S.forms.ltpR={pid:'',cond:f.cond,dur:f.dur,every:f.every};
    toast(`${t('planSaved')} ${p.name}`); render();
  }
  if(form.dataset.form==='book'){
    const id=form.dataset.id, f=S.forms.book, doc=D(id);
    if(!String(f.name).trim()){document.getElementById('bk-name').focus();return;}
    const est=Date.now()+newEst(doc)*MIN;
    const p=mk(id,S.next[id]++,String(f.name).trim(),f.age,S.me.g,'online','waiting',{isMe:true,phone:f.phone,symptoms:f.symptoms,history:f.history,paid:f.pay==='online'?'paid':'due',fee:doc.fee});
    p.order=maxOrder(id)+1; S.queue[id].push(p);
    sendMsg(p,'booked',{time:`${fmt(est-5*MIN)} – ${fmt(est+5*MIN)}`});
    checkReminders(id);
    S.pBook=null; S.pTab='turn'; toast(`${t('bookedToast')} #${p.token}`);
    render();
  }
});
document.addEventListener('toggle',e=>{if(e.target.id==='doneDet')S.doneOpen=e.target.open;},true);
document.addEventListener('copy',e=>{const s=window.getSelection();if(s&&s.anchorNode&&s.anchorNode.parentElement&&s.anchorNode.parentElement.closest('.hist'))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();}});
matchMedia('(min-width:1240px)').addEventListener('change',render);
render();
</script>
